<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type='radio']{
            display: none;
        }
        input[type='radio']:checked{
            background-color: red;
            height: 5em;
        }
        .radio{
            display: inline-block;
            width: 1em;
            height: 1em;
            border-radius: 100%;
            border: 2px solid red;
        }
        /* Select .radio which is a sibling of input[type='radio']:checked */
        input[type='radio']:checked+.radio{
            background-color:red;
        }
    </style>
</head>
<body>
    <form action="">
        <label>user name <input type="text"></label><br>
        <label>
            male:
            <input type="radio" name="gender">
            <div class="radio"></div>
        </label>

        <label>female: <input type="radio" name="gender"><div class="radio"></div></label>
    </form>
</body>
</html>
