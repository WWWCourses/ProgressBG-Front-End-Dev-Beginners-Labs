<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>semanticBlockElements </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <style>
        nav{
            width: 50%;
            border:10px solid #0F0;
        }
        nav li{
            display: inline-block;
            width: calc(100%/3);
            margin-left: -0.47em;
            vertical-align: top;
            border:1px solid #F00;
        }
        #li-first{
            margin-left: 0;
        }
        #li-second{
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li id="li-first"><a href="#">Products</a></li>
            <li id="li-second"><a href="#">About</a></li>
            <li><a href="#">Contacts</a></li>
        </ul>
    </nav>
    <main>
        <ul>
            <li><a href="">Page1</a></li>
            <li><a href="">Page2</a></li>
            <li><a href="">Page3</a></li>
        </ul>
    </main>
</body>
</html>
