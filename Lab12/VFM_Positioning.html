<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFM Positioning</title>

    <style>
        body{
            margin: 0;
        }
        .red{
            /* display:inline-block; */
            visibility:hidden;
            width: 5em;
            height: 5em;
            vertical-align: top;
            background-color:#F00;
            border: 10px solid #FF0;
        }
        .blue{
            border: 10px solid #FF0;
            display: inline-block;
            width: 5em;
            height: 10em;
            vertical-align: top;
            margin-left: -0.35em;
            background-color:#00F;
        }
    </style>
</head>
<body>
    <div class="red"></div>
    <div class="blue"></div>
</body>
</html>
