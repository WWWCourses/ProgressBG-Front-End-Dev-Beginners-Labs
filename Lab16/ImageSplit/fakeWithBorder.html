<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake "Split" background with borders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <style>
        .product-section {
            display: flex;
            width: 80vw;
            height: 50vh;
            margin: 1em auto;
            background: url('../../images/checkmate-1511866_640.jpg') no-repeat;
            background-size: cover;
        }
        .product {
            flex: 1 1 20%;
            height: 100%;
            background-size: 50%;
            background-position: center;
            border-left:2em solid #FFF;
            box-sizing: border-box;
        }
        .product:nth-child(1) {
            border-left:none
        }
    </style>
</head>
<body>
    <div class="product-section">
        <div class="product"></div>
        <div class="product"></div>
        <div class="product"></div>
        <div class="product"></div>
        <div class="product"></div>
    </div>
</body>
</html>
